apiVersion: apps/v1
kind: Deployment
metadata:
  name: careeros-app
  namespace: careeros
  labels:
    app: careeros-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careeros-app
  template:
    metadata:
      labels:
        app: careeros-app
    spec:
      containers:
        - name: app
          image: ghcr.io/iMeet07/careeros:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: careeros-config
            - secretRef:
                name: careeros-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: careeros-app
  namespace: careeros
spec:
  selector:
    app: careeros-app
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: careeros-app
  namespace: careeros
spec:
  to:
    kind: Service
    name: careeros-app
  port:
    targetPort: 3001
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
